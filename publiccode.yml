description:
  it:
    shortDescription: Framework PWA Zero-Trust & Zero-Dependency con SDK e Dashboard
      PA per consultazione protetta di atti e resilienza offline-first.
    longDescription: >
      Proof of Concept ( PoC ) di un'architettura software sovrana e
      Zero-Dependency per Progressive Web App ( PWA ) basata sul Core Panzer in
      modalità Zero-Trust, pensata per la Pubblica Amministrazione e per
      contesti con connettività discontinua o degradata.

      Il sistema garantisce continuità operativa offline-first, consultazione
      protetta di atti e documenti PA tramite viewer isolato anti-estrazione e
      rispondenza ai requisiti tecnici di riuso, sicurezza e tutela del dato
      secondo CAD, GDPR e NIS2.

      La sicurezza è basata su validazione forense dei payload, cifratura
      AES-GCM 256-bit tramite Web Crypto API e protezione dell'integrità della
      stiva locale (IndexedDB / CacheStorage).

      L'infrastruttura integra hardening anti-profiling (sterilizzazione degli
      errori, iniezione di rumore temporale) per ridurre l'esposizione ad
      analisi side-channel e bonifica attiva della memoria in RAM.

      Il framework include un SDK modulare e una Dashboard PA per Sync Download,
      monitoraggio dello stato della cache e gestione documentale protetta.
    features:
      - Architettura Zero-Trust con cifratura AES-GCM 256-bit (Web Crypto API).
      - Service Worker Panzer Core offline-first con sync adattiva e anti-Lie-Fi.
      - Dashboard PA per Sync Download, stato cache e consultazione atti
        protetta.
      - Bonifica RAM, purga locale atomica e verifica forense di file e PDF.
      - Hardening anti-profiling con sterilizzazione errori e jitter temporale.
  en:
    shortDescription: Zero-Trust & Zero-Dependency PWA framework with SDK and PA
      Dashboard for secure document access and offline-first resilience.
    longDescription: >
      Proof of Concept (PoC) of a sovereign, Zero-Dependency software
      architecture for Progressive Web Apps (PWA) powered by Panzer Core under a
      Zero-Trust paradigm, designed for Public Administration and intermittent
      or degraded network environments.

      The system provides offline-first operational continuity, protected access
      to PA documents via an anti-extraction isolated viewer, and alignment with
      reuse, security, and data protection requirements under CAD, GDPR, and
      NIS2.

      Security relies on forensic payload validation, AES-GCM 256-bit encryption
      via the Web Crypto API, and local storage integrity protection (IndexedDB
      / CacheStorage).

      The infrastructure integrates anti-profiling hardening (error
      sanitization, temporal noise injection) to reduce side-channel exposure,
      alongside active RAM zeroization.

      The framework includes a modular SDK and a PA Dashboard for Sync Download,
      cache status monitoring, and protected document workflows.
    features:
      - Zero-Trust architecture with AES-GCM 256-bit encryption (Web Crypto API).
      - Offline-first Panzer Core Service Worker with adaptive sync and
        anti-Lie-Fi.
      - PA Dashboard for Sync Download, cache monitoring, and protected viewing.
      - Active RAM zeroization, atomic local purge, and forensic file/PDF checks.
      - Anti-profiling hardening with error sanitization and timing jitter.
