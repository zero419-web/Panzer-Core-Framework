description:
  it:
    shortDescription: "Engine PWA Zero-Trust & Zero-Dependency con SDK integrato e Dashboard PA per la consultazione protetta di atti."
    longDescription: |
      Proof of Concept ( PoC ) di un'architettura software sovrana per Progressive Web App ( PWA ) basata sul Core Panzer, progettata in modalità Zero-Trust.
      Il sistema garantisce massima resilienza informatica, continuità operativa offline-first, consultazione protetta di atti e documenti PA tramite iframe anti-estrazione, e piena conformità alle linee guida tecniche AgID e al Codice dell'Amministrazione Digitale ( CAD ) per il riuso.
      La sicurezza è blindata da validazione crittografica binaria, cifratura AES-GCM 256-bit e protocolli di protezione dell'integrità della stiva locale (IndexedDB / CacheStorage).
      L'infrastruttura integra protocolli di Hardening Anti-Profiling ( sterilizzazione degli errori, iniezione di rumore temporale ) per prevenire attacchi di tipo side-channel.
      Il framework include SDK modulare e Dashboard di sincronizzazione ( Sync Download ) e monitoraggio dello stato di cache per la Pubblica Amministrazione.
    features:
      - "Architettura Zero-Trust con cifratura AES-GCM 256-bit ( Web Crypto API )."
      - "Motore Service Worker Panzer Core con logica di resilienza adattiva e gestione offline-first."
      - "Dashboard PA per Sync Download, monitoraggio cache e viewer documentale protetto anti-estrazione."
      - "Protocolli di auto-protezione, bonifica RAM e purga atomica della stiva locale."
      - "Hardening operativo: Anti-Profiling, sterilizzazione stack trace e livellamento temporale."
  en:
    shortDescription: "Zero-Trust & Zero-Dependency PWA Engine with integrated SDK and PA Dashboard for secure document consultation."
    longDescription: |
      Proof of Concept (PoC) of a sovereign software architecture for Progressive Web Apps (PWA) powered by the Panzer Core Engine under a Zero-Trust paradigm.
      The system guarantees maximum cybersecurity resilience, offline-first operational continuity, secure consultation of PA documents via anti-extraction iframe viewers, and full compliance with AgID technical guidelines and the Digital Administration Code (CAD) for software reuse.
      Security is enforced via binary cryptographic validation, AES-GCM 256-bit encryption, and local storage integrity protection protocols (IndexedDB / CacheStorage).
      The infrastructure integrates Anti-Profiling Hardening protocols (error sanitization, temporal RTT noise injection) to mitigate side-channel attacks.
      The framework includes a modular SDK and a Dashboard for Sync Download and cache status monitoring tailored for Public Administration.
    features:
      - "Zero-Trust architecture with AES-GCM 256-bit encryption (Web Crypto API)."
      - "Panzer Core Service Worker engine with adaptive resilience and offline-first routing."
      - "PA Dashboard for Sync Download, cache monitoring, and anti-extraction secure document viewer."
      - "Self-protection protocols, active RAM zeroization, and atomic local storage purge."
      - "Operational hardening: Anti-Profiling, stack trace sterilization, and RTT jitter injection."
